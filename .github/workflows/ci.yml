name: CI

# The hosting platform auto-deploys from `main` on push, so a broken commit
# would otherwise reach production unchecked. This gate runs the same three
# checks used locally before any deploy.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel an in-flight run when a newer commit lands on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck, test, build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Node 20 is deprecated on GitHub runners (actions are forced onto 24).
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json

      # The repo is a plain two-package layout (no npm workspaces), so each
      # package installs independently. --include=dev is explicit because
      # tsc/vite are devDependencies and CI must not skip them.
      - name: Install dependencies
        run: |
          npm ci --include=dev
          npm --prefix backend ci --include=dev
          npm --prefix frontend ci --include=dev

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Proves the compiled artifacts the platform expects actually get built:
      # backend/dist/src/server.js and frontend/dist/index.html.
      - name: Build
        run: npm run build:all

      - name: Verify build artifacts exist
        run: |
          test -f backend/dist/src/server.js || { echo "missing backend/dist/src/server.js"; exit 1; }
          test -f frontend/dist/index.html || { echo "missing frontend/dist/index.html"; exit 1; }
          echo "build artifacts present"
