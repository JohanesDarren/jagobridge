services:
  postgres:
    image: postgres:16-alpine
    container_name: jagobridge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: jago
      POSTGRES_PASSWORD: jago
      POSTGRES_DB: jagobridge
    ports:
      - "5440:5432"
    volumes:
      - jagobridge_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jago -d jagobridge"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: jagobridge-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6380:6379"
    volumes:
      - jagobridge_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  jagobridge_pgdata:
  jagobridge_redisdata:
